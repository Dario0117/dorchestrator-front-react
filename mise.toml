[tools]
bun = "1.3.6"

[env]
NODE_ENV = "development"
BETTER_AUTH_URL = { required = true }
VITE_BACKEND_BASE_URL = { required = true }
VITE_FRONTEND_BASE_URL = { required = true }

[tasks.dev]
depends = ["checkTs", "formatAndLint", "openApi"]
run = "bun run dev"

[tasks.devnd]
run = "bun run dev"

[tasks.devForAgents]
run = "bun run dev"
description = "Start dev server for AI agents (no dependency checks)"

[tasks.test]
depends = ["checkTs", "formatAndLint"]
run = "bun run test"

[tasks.testForAgents]
run = "bun run test"
env = { "VITEST_IS_AGENT_TEST" = "true" }

[tasks.coverage]
depends = ["checkTs", "formatAndLint"]
run = "bun run coverage"

[tasks.coverageForAgents]
env = { "VITEST_IS_AGENT_TEST" = "true" }
run = "bun run coverage > /dev/null 2>&1 && bun scripts/check-coverage-gaps.ts"

[tasks.checkTs]
run = "bun run check-ts"

[tasks.formatAndLint]
depends = ["checkTs"]
run = "bun format-and-lint:fix"

[tasks.formatAndLintCheck]
depends = ["checkTs"]
run = "bun format-and-lint:check"

[tasks.openApi]
run = "bun run open-api"
description = "Generate OpenAPI types from backend"

[tasks.openApiForAgents]
run = "bunx openapi-typescript http://localhost:9001/openapi/json --output ./src/types/api.generated.types.ts"
description = "Generate OpenAPI types from backend running on agent port (9001)"

[tasks.storybook]
run = "bun run storybook"
description = "Start Storybook development server"

[tasks.buildStorybook]
run = "bun run build-storybook"
description = "Build Storybook for production"

[tasks.build]
depends = ["checkTs", "formatAndLint"]
run = "bun run build"

[tasks.preview]
run = "bun run preview"
description = "Preview production build"

[tasks.deadCode]
run = "bun run dead-code"
description = "Find unused files, exports, types, and dependencies (knip)"

[tasks."scaffold:service"]
run = "bun scripts/scaffold/service.ts"
description = "Scaffold a new HTTP service + MSW handler"

[tasks."scaffold:form"]
run = "bun scripts/scaffold/form.ts"
description = "Scaffold a new form (5 files)"

[tasks."scaffold:service-constants"]
run = "bun scripts/scaffold/service-constants.ts"
description = "Scaffold service constants file for API-derived types"

[tasks."scaffold:component"]
run = "bun scripts/scaffold/component.ts"
description = "Scaffold a new component with types, test, and stories"
